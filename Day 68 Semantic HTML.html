
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML</title>
</head>
<body>

    <header>
        <h1>My Website</h1>
        <p>Welcome to my website!</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <main>
        <section id="home">
            <h2>Home</h2>
            <p>This is the home section of my website.</p>
        </section>

        <section id="about">
            <h2>About Me</h2>
            <p>I am a BSCS student learning web development.</p>
        </section>

        <article>
            <h2>My First Blog</h2>
            <p>Today I learned Semantic HTML tags.</p>
        </article>
    </main>

    <footer id="contact">
        <p>Contact: example@email.com</p>
        <p>Copyright 2026</p>
    </footer>

</body>
</html>
