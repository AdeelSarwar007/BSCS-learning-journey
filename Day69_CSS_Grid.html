

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .card {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000020;
        }

        .card h2 {
            color: #2563eb;
        }

        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <h1>My Student Dashboard</h1>

    <div class="container">
        <div class="card">
            <h2>HTML</h2>
            <p>Webpage Structure</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Webpage Design</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Webpage Functionality</p>
        </div>

        <div class="card">
            <h2>Python</h2>
            <p>Programming</p>
        </div>

        <div class="card">
            <h2>Database</h2>
            <p>Data Management</p>
        </div>

        <div class="card">
            <h2>Projects</h2>
            <p>Practical Learning</p>
        </div>
    </div>
</body>
</html>
