
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 70 - JavaScript DOM</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f1f5f9;
        }

        h1 {
            color: blue;
        }

        button {
            padding: 12px 20px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1 id="title">Hello Student!</h1>

    <p class="message">Welcome to my website.</p>

    <button onclick="changeText()">Change Text</button>

    <script>
        function changeText() {
            let heading = document.getElementById("title");

            heading.innerText = "JavaScript DOM Learned!";

            heading.style.color = "red";

            document.querySelector(".message").innerText =
                "I can change HTML using JavaScript!";
        }
    </script>

</body>
</html>
