
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 65 - Grade Checker</title>
</head>
<body>

    <h1>Student Grade Checker</h1>

    <script>
        let marks = Number(prompt("Enter your marks (0-100)"));

        if (marks < 0 || marks > 100 || !Number.isFinite(marks)) {
            alert("Please enter valid marks between 0 and 100.");
        }
        else if (marks >= 80) {
            alert("Grade A");
        }
        else if (marks >= 70) {
            alert("Grade B");
        }
        else if (marks >= 60) {
            alert("Grade C");
        }
        else if (marks >= 50) {
            alert("Grade D");
        }
        else {
            alert("Fail");
        }
    </script>

</body>
</html>
