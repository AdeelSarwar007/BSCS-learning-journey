<!DOCTYPE html>
<html>

<head>

<title>Student Card</title>

<style>

body{

    background-color: lightgray;

}

.card{

    width: 350px;

    border: 2px solid black;

    padding: 20px;

    margin: 30px;

    background-color: white;

    border-radius: 15px;

    box-shadow: 5px 5px 10px gray;

}

h1{

    color: blue;

    text-align: center;

}

p{

    color: green;

    font-size: 18px;

}

</style>

</head>

<body>

<div class="card">

<h1>Adeel Sarwar</h1>

<p>Age: 21</p>

<p>City: Vehari</p>

<p>Degree: BSCS</p>

<p>CGPA: 3.28</p>

</div>

</body>

</html>
