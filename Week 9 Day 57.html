<!DOCTYPE html>
<html>
    <head>
        <title>Skills Dashboard</title>
        <style>
            body{
                background-color: blanchedalmond;
                font-family:Arial;
            }
            .skills{
                display:flex;
                gap:20px;
                flex-wrap:wrap;
                justify-content:center;
            }
            .skill-card{

                width:180px;

                padding:20px;

                background:white;

                border-radius:15px;

                box-shadow:5px 5px 10px gray;

                text-align:center;

            }
            .skill-card:hover{

                background-color:lightblue;

            }

        </style>
        <body>
            <h1 style="text-align:center;">
                My Skills
            </h1>
            <div class="skills">
                <div class="skill-card">
                    <h2>SQL</h2>
                </div>
                <div class="skill-card">
                    <h2>Html</h2>
                </div>

            </div>
        </body>
    </head>
</html>
