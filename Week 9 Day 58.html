<!DOCTYPE html>
<html>

<head>

<title>Contact Form</title>

<style>

body{

    font-family:Arial;

    background:#f0f0f0;

}

.contact{

    width:90%;

    max-width:500px;

    margin:30px auto;

    padding:20px;

    background:white;

    border-radius:15px;

    box-shadow:5px 5px 10px gray;

}

input, textarea{

    width:100%;

    padding:10px;

    margin-top:10px;

    margin-bottom:15px;

}

button{

    background:blue;

    color:white;

    padding:10px 20px;

    border:none;

    border-radius:10px;

    cursor:pointer;

}

button:hover{

    background:red;

}

</style>

</head>

<body>

<div class="contact">

<h2>Contact Me</h2>

<form>

<input type="text" placeholder="Enter Name">

<input type="email" placeholder="Enter Email">

<textarea placeholder="Enter Message"></textarea>

<button>

Submit

</button>

</form>

</div>

</body>

</html>
